name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: racheeta
          POSTGRES_PASSWORD: racheeta
          POSTGRES_DB: racheeta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U racheeta -d racheeta"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # CI-only values. None of these are production secrets.
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,testserver
      DATABASE_URL: postgres://racheeta:racheeta@localhost:5432/racheeta
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
      # Placeholder so the production email check passes; nothing is sent in CI.
      EMAIL_URL: smtp://localhost:25
      FRONTEND_URL: https://ci.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Django system checks
        run: python manage.py check
      - name: Missing migrations check
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python -m pytest
      - name: OpenAPI contract is up to date
        run: |
          python manage.py spectacular --file /tmp/openapi.yaml --validate --settings=config.test_settings
          diff -u ../docs/api/openapi.yaml /tmp/openapi.yaml \
            || (echo "::error::docs/api/openapi.yaml is stale. Run: make openapi" && exit 1)

  web:
    name: Web (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned: must match mobile/pubspec.yaml (environment.flutter) and docs/DECISIONS.md.
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - name: Resolve dependencies (lockfile must be up to date)
        run: flutter pub get --enforce-lockfile
      - name: Format check
        run: dart format --output=none --set-exit-if-changed .
      - name: Static analysis
        run: flutter analyze --fatal-infos
      - name: Tests
        run: flutter test


  mobile-release-android:
    name: Mobile release build (Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      # Ephemeral CI-only signing. Production keystores/passwords belong in the owner's secret
      # manager / CI secrets and are never committed.
      RACHEETA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/racheeta-ci.jks
      RACHEETA_ANDROID_STORE_PASSWORD: ci-only-password
      RACHEETA_ANDROID_KEY_ALIAS: ci
      RACHEETA_ANDROID_KEY_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Generate ephemeral CI signing key
        run: >
          keytool -genkeypair -v
          -keystore "$RACHEETA_ANDROID_KEYSTORE_PATH"
          -storepass "$RACHEETA_ANDROID_STORE_PASSWORD"
          -keypass "$RACHEETA_ANDROID_KEY_PASSWORD"
          -alias "$RACHEETA_ANDROID_KEY_ALIAS"
          -keyalg RSA -keysize 2048 -validity 1
          -dname "CN=Racheeta CI, O=CI, C=IQ"
      - name: Build production-mode app bundle
        run: >
          flutter build appbundle --release
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://api.ci.invalid
      - name: Report bundle size
        run: ls -lh build/app/outputs/bundle/release/app-release.aab

  mobile-release-ios:
    name: Mobile release build (iOS, no codesign)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build production-mode iOS app without signing
        run: >
          flutter build ios --release --no-codesign
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://api.ci.invalid

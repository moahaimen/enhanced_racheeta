name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: racheeta
          POSTGRES_PASSWORD: racheeta
          POSTGRES_DB: racheeta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U racheeta -d racheeta"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # CI-only values. None of these are production secrets.
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,testserver
      DATABASE_URL: postgres://racheeta:racheeta@localhost:5432/racheeta
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
      # Placeholder so the production email check passes; nothing is sent in CI.
      EMAIL_URL: smtp://localhost:25
      FRONTEND_URL: https://ci.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Django system checks
        run: python manage.py check
      - name: Missing migrations check
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python -m pytest
      - name: OpenAPI contract is up to date
        run: |
          python manage.py spectacular --file /tmp/openapi.yaml --validate --settings=config.test_settings
          diff -u ../docs/api/openapi.yaml /tmp/openapi.yaml \
            || (echo "::error::docs/api/openapi.yaml is stale. Run: make openapi" && exit 1)

  web:
    name: Web (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned: must match mobile/pubspec.yaml (environment.flutter) and docs/DECISIONS.md.
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - name: Resolve dependencies (lockfile must be up to date)
        run: flutter pub get --enforce-lockfile
      - name: Format check
        run: dart format --output=none --set-exit-if-changed .
      - name: Static analysis
        run: flutter analyze --fatal-infos
      - name: Tests
        run: flutter test

  mobile-release:
    name: Mobile release smoke (Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      # Keep Gradle's heap modest on the shared runner (gradle.properties asks for 8 GB).
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g"
      # NON-production staging values: the build only has to prove the release configuration works.
      RELEASE_DEFINES: "--dart-define=APP_ENV=staging --dart-define=API_BASE_URL=https://api.example.invalid"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses > /dev/null || true
      - name: A release build without production signing must FAIL (fail closed)
        run: |
          set +e
          flutter build apk --release --target-platform android-arm64 $RELEASE_DEFINES > /tmp/unsigned.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::a release build succeeded without release signing credentials"; exit 1
          fi
          grep -q "Release signing is not configured" /tmp/unsigned.log \
            || (tail -40 /tmp/unsigned.log; echo "::error::build failed for another reason"; exit 1)
      - name: Release APK (explicit NON-production smoke signing)
        env:
          ORG_GRADLE_PROJECT_racheetaAllowDebugSignedRelease: "true"
        run: flutter build apk --release --target-platform android-arm64 $RELEASE_DEFINES
      - name: Verify the release APK (id, permissions, backup, exports, no dev URL)
        run: python3 tool/verify_release_apk.py build/app/outputs/flutter-apk/app-release.apk
      - name: Release App Bundle (explicit NON-production smoke signing)
        env:
          ORG_GRADLE_PROJECT_racheetaAllowDebugSignedRelease: "true"
        run: flutter build appbundle --release $RELEASE_DEFINES
      # Artifacts are NOT uploaded: this job proves the release path compiles, nothing is published.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: racheeta
          POSTGRES_PASSWORD: racheeta
          POSTGRES_DB: racheeta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U racheeta -d racheeta"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # CI-only values. None of these are production secrets.
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,testserver
      DATABASE_URL: postgres://racheeta:racheeta@localhost:5432/racheeta
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Django system checks
        run: python manage.py check
      - name: Missing migrations check
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python -m pytest
      - name: OpenAPI contract is up to date
        run: |
          python manage.py spectacular --file /tmp/openapi.yaml --validate --settings=config.test_settings
          diff -u ../docs/api/openapi.yaml /tmp/openapi.yaml \
            || (echo "::error::docs/api/openapi.yaml is stale. Run: make openapi" && exit 1)

  web:
    name: Web (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build

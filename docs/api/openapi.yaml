components:
  schemas:
    Account:
      type: object
      description: Read-only representation. Never includes password or privilege
        internals.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        full_name:
          type: string
          readOnly: true
        phone_number:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/AccountRoleEnum'
          readOnly: true
        account_type:
          allOf:
          - $ref: '#/components/schemas/AccountTypeEnum'
          readOnly: true
        preferred_language:
          allOf:
          - $ref: '#/components/schemas/PreferredLanguageEnum'
          readOnly: true
        email_verified:
          type: boolean
          readOnly: true
        email_verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        has_password:
          type: boolean
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
          description: Grants access to the Django admin site.
        permissions:
          type: array
          items:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: آخر دخول
      required:
      - account_type
      - created_at
      - email
      - email_verified
      - email_verified_at
      - full_name
      - has_password
      - id
      - is_staff
      - last_login
      - permissions
      - phone_number
      - preferred_language
      - role
    AccountRoleEnum:
      enum:
      - PATIENT
      - PROVIDER
      - MEDICAL_COMPANY
      - REAL_ESTATE_SELLER
      - ADMIN
      type: string
      description: |-
        * `PATIENT` - Patient
        * `PROVIDER` - Healthcare provider
        * `MEDICAL_COMPANY` - Medical company / supplier
        * `REAL_ESTATE_SELLER` - Medical real-estate owner or agent
        * `ADMIN` - Racheeta administrator
    AccountTypeEnum:
      enum:
      - PATIENT
      - JOB_SEEKER
      - EMPLOYER
      - DOCTOR
      - DENTIST
      - NURSE
      - MIDWIFE
      - THERAPIST
      - HOSPITAL
      - MEDICAL_CENTER
      - PHARMACY
      - LABORATORY
      - BEAUTY_CENTER
      - PHARMACEUTICAL_COMPANY
      - SCIENTIFIC_OFFICE
      - MEDICAL_SUPPLIES_OFFICE
      - EQUIPMENT_SUPPLIER
      - ASSISTIVE_DEVICE_STORE
      - PHARMA_DISTRIBUTOR
      - PROPERTY_OWNER
      - PROPERTY_AGENT
      type: string
      description: |-
        * `PATIENT` - Patient
        * `JOB_SEEKER` - Job seeker (any profession)
        * `EMPLOYER` - Employer / recruiter
        * `DOCTOR` - Doctor
        * `DENTIST` - Dentist
        * `NURSE` - Nurse
        * `MIDWIFE` - Midwife
        * `THERAPIST` - Therapist
        * `HOSPITAL` - Hospital
        * `MEDICAL_CENTER` - Medical center / clinic
        * `PHARMACY` - Pharmacy
        * `LABORATORY` - Laboratory
        * `BEAUTY_CENTER` - Beauty center
        * `PHARMACEUTICAL_COMPANY` - Pharmaceutical company
        * `SCIENTIFIC_OFFICE` - Scientific office
        * `MEDICAL_SUPPLIES_OFFICE` - Medical supplies office
        * `EQUIPMENT_SUPPLIER` - Medical equipment supplier
        * `ASSISTIVE_DEVICE_STORE` - Assistive devices store
        * `PHARMA_DISTRIBUTOR` - Pharmaceutical distributor
        * `PROPERTY_OWNER` - Medical property owner
        * `PROPERTY_AGENT` - Medical property agent / manager
    ActivateRequest:
      type: object
      properties:
        term_days:
          type: integer
          maximum: 3660
          minimum: 1
        reference:
          type: string
          default: ''
          maxLength: 120
        note:
          type: string
          default: ''
          maxLength: 500
        payment:
          $ref: '#/components/schemas/ActivationPaymentRequest'
    ActivationPaymentRequest:
      type: object
      description: |-
        The payment an administrator verified before activating. Its status is
        not an input: activation succeeds only for a verified payment, so the
        server records VERIFIED (see ActivateSerializer.validate).
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        currency:
          type: string
          minLength: 1
          maxLength: 3
        method:
          $ref: '#/components/schemas/MethodEnum'
        reference:
          type: string
          maxLength: 120
        note:
          type: string
          maxLength: 500
    AdminCompany:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        account_email:
          type: string
          format: email
      required:
      - account_email
      - id
      - name
    AdminDashboard:
      type: object
      properties:
        accounts:
          $ref: '#/components/schemas/DashboardAdminAccounts'
        providers:
          $ref: '#/components/schemas/DashboardAdminProviders'
        medical_companies:
          $ref: '#/components/schemas/DashboardAdminCompanies'
        employers:
          $ref: '#/components/schemas/DashboardAdminEmployers'
        jobs:
          $ref: '#/components/schemas/DashboardAdminJobs'
        reservations:
          $ref: '#/components/schemas/DashboardAdminReservations'
        marketplace:
          $ref: '#/components/schemas/DashboardAdminMarketplace'
        real_estate:
          $ref: '#/components/schemas/DashboardAdminRealEstate'
        advertising:
          $ref: '#/components/schemas/DashboardAdminAdvertising'
        billing:
          $ref: '#/components/schemas/DashboardAdminBilling'
        audit:
          $ref: '#/components/schemas/DashboardAdminAudit'
      required:
      - accounts
      - advertising
      - audit
      - billing
      - employers
      - jobs
      - marketplace
      - medical_companies
      - providers
      - real_estate
      - reservations
    AdminDecisionRequest:
      type: object
      properties:
        note:
          type: string
          default: ''
          maxLength: 500
    AdminOrder:
      type: object

      - amount
      - billing_account
      - key
    DegreeEnum:
      enum:
      - DIPLOMA
      - BACHELOR
      - HIGHER_DIPLOMA
      - MASTER
      - PHD
      - BOARD
      - OTHER
      type: string
      description: |-
        * `DIPLOMA` - Diploma
        * `BACHELOR` - Bachelor
        * `HIGHER_DIPLOMA` - Higher diploma
        * `MASTER` - Master
        * `PHD` - PhD
        * `BOARD` - Board certification
        * `OTHER` - Other
    Detail:
      type: object
      properties:
        detail:
          type: string
          readOnly: true
      required:
      - detail
    Education:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        degree:
          $ref: '#/components/schemas/DegreeEnum'
        field_of_study:
          type: string
          maxLength: 150
        institution_name:
          type: string
          maxLength: 150
        start_year:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        end_year:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
      required:
      - degree
      - field_of_study
      - id
      - institution_name
    EducationRequest:
      type: object
      properties:
        degree:
          $ref: '#/components/schemas/DegreeEnum'
        field_of_study:
          type: string
          minLength: 1
          maxLength: 150
        institution_name:
          type: string
          minLength: 1
          maxLength: 150
        start_year:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        end_year:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
      required:
      - degree
      - field_of_study
      - institution_name
    EmailVerificationConfirmRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 64
        token:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - token
      - uid
    EmployerAdmin:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
          description: Recruitment display name
        organization_type:
          allOf:
          - $ref: '#/components/schemas/OrganizationTypeEnum'
          readOnly: true
        description:
          type: string
          readOnly: true

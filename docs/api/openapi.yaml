openapi: 3.0.3
info:
  title: Racheeta API
  version: 1.0.0
  description: Racheeta 2.0 — canonical API consumed by web, mobile and dashboards.
paths:
  /api/v1/admin/audit:
    get:
      operationId: admin_audit_list
      summary: Audit history (administrators)
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: action__startswith
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: target_id
        schema:
          type: string
      - in: query
        name: target_type
        schema:
          type: string
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/v1/admin/billing/accounts/{id}:
    get:
      operationId: admin_billing_accounts_retrieve
      summary: Entitlement state of a billing account (administrators)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSummary'
          description: ''
  /api/v1/admin/billing/credits:
    post:
      operationId: admin_billing_credits_create
      summary: Grant or revoke extra credits for an entitlement key
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditGrantRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreditGrantRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditBalance'
          description: ''
  /api/v1/admin/billing/subscriptions:
    get:
      operationId: admin_billing_subscriptions_list
      summary: Subscriptions (administrators)
      parameters:
      - in: query
        name: billing_account__subject_type
        schema:
          type: string
          enum:
          - account
          - organization
        description: |-
          * `organization` - Organisation
          * `account` - Account
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: plan__code
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - CANCELLED
          - EXPIRED
          - PENDING
          - REJECTED
          - SUSPENDED
        description: |-
          * `PENDING` - Pending administrator approval
          * `ACTIVE` - Active
          * `SUSPENDED` - Suspended
          * `CANCELLED` - Cancelled
          * `EXPIRED` - Expired
          * `REJECTED` - Rejected
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminSubscriptionList'
          description: ''
  /api/v1/admin/billing/subscriptions/{id}/activate:
    post:
      operationId: admin_billing_subscriptions_activate_create
      summary: Activate a subscription after verifying payment manually
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSubscription'
          description: ''
  /api/v1/admin/billing/subscriptions/{id}/cancel:
    post:
      operationId: admin_billing_subscriptions_cancel_create
      summary: Cancel a subscription
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSubscription'
          description: ''
  /api/v1/admin/billing/subscriptions/{id}/reject:
    post:
      operationId: admin_billing_subscriptions_reject_create
      summary: Reject a pending subscription request
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSubscription'
          description: ''
  /api/v1/admin/billing/subscriptions/{id}/suspend:
    post:
      operationId: admin_billing_subscriptions_suspend_create
      summary: Suspend an active subscription
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSubscription'
          description: ''
  /api/v1/admin/providers/{id}/verification:
    post:
      operationId: admin_providers_verification_create
      summary: Set a provider's verification status (administrators)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationDecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerificationDecisionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderOwner'
          description: ''
  /api/v1/admin/recruitment/employers:
    get:
      operationId: admin_recruitment_employers_list
      summary: Employers (administrators)
      parameters:
      - in: query
        name: organization_type
        schema:
          type: string
          enum:
          - BEAUTY_CENTER
          - CLINIC
          - HEALTHCARE_INSTITUTION
          - HOSPITAL
          - LABORATORY
          - MEDICAL_CENTER
          - MEDICAL_COMPANY
          - OTHER
          - PHARMACY
          - RECRUITMENT_AGENCY
          - UNIVERSITY
        description: |-
          * `HOSPITAL` - Hospital
          * `MEDICAL_CENTER` - Medical center
          * `CLINIC` - Clinic
          * `PHARMACY` - Pharmacy
          * `LABORATORY` - Laboratory
          * `BEAUTY_CENTER` - Beauty center
          * `MEDICAL_COMPANY` - Medical company
          * `HEALTHCARE_INSTITUTION` - Healthcare institution
          * `UNIVERSITY` - University / college
          * `RECRUITMENT_AGENCY` - Recruitment agency
          * `OTHER` - Other approved healthcare organisation
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: recruitment_status
        schema:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
        description: |-
          * `ACTIVE` - Active
          * `SUSPENDED` - Suspended
      - name: search
        required: false
        in: query
        description: مصطلح البحث.
        schema:
          type: string
      - in: query
        name: verification_status
        schema:
          type: string
          enum:
          - PENDING
          - REJECTED
          - SUSPENDED
          - UNVERIFIED
          - VERIFIED
        description: |-
          * `UNVERIFIED` - Unverified
          * `PENDING` - Pending review
          * `VERIFIED` - Verified
          * `REJECTED` - Rejected
          * `SUSPENDED` - Suspended
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEmployerAdminList'
          description: ''
  /api/v1/admin/recruitment/employers/{id}/recruitment/{status_value}:
    post:
      operationId: admin_recruitment_employers_recruitment_create
      summary: Suspend or reactivate an employer's recruitment
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: status
        schema:
          type: string
        description: ACTIVE or SUSPENDED
      - in: path
        name: status_value
        schema:
          type: string
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecruitmentReasonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecruitmentReasonRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployerAdmin'
          description: ''
  /api/v1/admin/recruitment/employers/{id}/verification:
    post:
      operationId: admin_recruitment_employers_verification_create
      summary: Set an employer's verification status
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployerVerificationDecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmployerVerificationDecisionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployerAdmin'
          description: ''
  /api/v1/admin/recruitment/jobs:
    get:
      operationId: admin_recruitment_jobs_list
      summary: Jobs for review (administrators)
      parameters:
      - in: query
        name: employer
        schema:
          type: string
          format: uuid
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ARCHIVED
          - CLOSED
          - DRAFT
          - EXPIRED
          - PENDING_ADMIN_REVIEW
          - PUBLISHED
          - REJECTED
          - SUSPENDED
        description: |-
          * `DRAFT` - Draft
          * `PENDING_ADMIN_REVIEW` - Pending administrator review
          * `PUBLISHED` - Published
          * `CLOSED` - Closed
          * `EXPIRED` - Expired
          * `REJECTED` - Rejected
          * `SUSPENDED` - Suspended
          * `ARCHIVED` - Archived
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJobAdminList'
          description: ''
  /api/v1/admin/recruitment/jobs/{id}:
    get:
      operationId: admin_recruitment_jobs_retrieve
      summary: Job details for review
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAdmin'
          description: ''
  /api/v1/admin/recruitment/jobs/{id}/approve:
    post:
      operationId: admin_recruitment_jobs_approve_create
      summary: Approve a pending job (publishes it)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminDecisionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAdmin'
          description: ''
  /api/v1/admin/recruitment/jobs/{id}/reject:
    post:
      operationId: admin_recruitment_jobs_reject_create
      summary: Reject a pending job with a reason
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecruitmentReasonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecruitmentReasonRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAdmin'
          description: ''
  /api/v1/admin/recruitment/jobs/{id}/restore:
    post:
      operationId: admin_recruitment_jobs_restore_create
      summary: Restore a suspended job
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminDecisionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAdmin'
          description: ''
  /api/v1/admin/recruitment/jobs/{id}/suspend:
    post:
      operationId: admin_recruitment_jobs_suspend_create
      summary: Suspend a published job with a reason
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecruitmentReasonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecruitmentReasonRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAdmin'
          description: ''
  /api/v1/auth/email-verification/confirm:
    post:
      operationId: auth_email_verification_confirm_create
      summary: Confirm an email address using a verification link
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/email-verification/request:
    post:
      operationId: auth_email_verification_request_create
      summary: Send (or resend) the email-verification link to the current account
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/firebase/exchange:
    post:
      operationId: auth_firebase_exchange_create
      description: Exchange a Firebase ID token (Google, phone, ...) for Racheeta
        tokens.
      summary: Exchange a Firebase ID token for Racheeta tokens
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirebaseExchangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FirebaseExchangeRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirebaseExchangeResponse'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirebaseExchangeResponse'
          description: ''
        '401':
          description: Firebase token invalid (firebase_token_invalid).
        '503':
          description: Firebase not enabled (firebase_not_configured).
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      summary: Log in with email and password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      description: Blacklists the given refresh token. Access tokens expire naturally.
      summary: Log out (revoke refresh token)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: Refresh token revoked.
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: auth_password_reset_confirm_create
      description: Revokes every refresh token of the account. Access tokens expire
        naturally.
      summary: Set a new password using a reset link
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/password-reset/request:
    post:
      operationId: auth_password_reset_request_create
      description: Always answers 202 with the same message, whether or not the email
        exists.
      summary: Request a password-reset email
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      summary: Rotate a refresh token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refresh'
          description: ''
  /api/v1/auth/register:
    post:
      operationId: auth_register_create
      summary: Register a new account
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
  /api/v1/billing/plans:
    get:
      operationId: billing_plans_list
      summary: Public plan catalogue
      parameters:
      - in: query
        name: audience
        schema:
          type: string
      tags:
      - billing
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
          description: ''
  /api/v1/employers/{id}:
    get:
      operationId: employers_retrieve
      summary: Public employer page
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployerPublic'
          description: ''
  /api/v1/geo/cities:
    get:
      operationId: geo_cities_list
      summary: Active cities (filter by governorate)
      parameters:
      - in: query
        name: governorate
        schema:
          type: string
          format: uuid
      tags:
      - geography
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'
          description: ''
  /api/v1/geo/countries:
    get:
      operationId: geo_countries_list
      summary: Active countries
      tags:
      - geography
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'
          description: ''
  /api/v1/geo/governorates:
    get:
      operationId: geo_governorates_list
      summary: Active governorates (filter by country)
      parameters:
      - in: query
        name: country
        schema:
          type: string
          format: uuid
      tags:
      - geography
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Governorate'
          description: ''
  /api/v1/jobs:
    get:
      operationId: jobs_list

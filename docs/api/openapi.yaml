openapi: 3.0.3
info:
  title: Racheeta API
  version: 1.0.0
  description: Racheeta 2.0 — canonical API consumed by web, mobile and dashboards.
paths:
  /api/v1/admin/providers/{id}/verification:
    post:
      operationId: admin_providers_verification_create
      summary: Set a provider's verification status (administrators)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationDecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerificationDecisionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderOwner'
          description: ''
  /api/v1/auth/email-verification/confirm:
    post:
      operationId: auth_email_verification_confirm_create
      summary: Confirm an email address using a verification link
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/email-verification/request:
    post:
      operationId: auth_email_verification_request_create
      summary: Send (or resend) the email-verification link to the current account
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/firebase/exchange:
    post:
      operationId: auth_firebase_exchange_create
      description: Exchange a Firebase ID token (Google, phone, ...) for Racheeta
        tokens.
      summary: Exchange a Firebase ID token for Racheeta tokens
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirebaseExchangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FirebaseExchangeRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirebaseExchangeResponse'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirebaseExchangeResponse'
          description: ''
        '401':
          description: Firebase token invalid (firebase_token_invalid).
        '503':
          description: Firebase not enabled (firebase_not_configured).
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      summary: Log in with email and password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      description: Blacklists the given refresh token. Access tokens expire naturally.
      summary: Log out (revoke refresh token)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: Refresh token revoked.
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: auth_password_reset_confirm_create
      description: Revokes every refresh token of the account. Access tokens expire
        naturally.
      summary: Set a new password using a reset link
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/password-reset/request:
    post:
      operationId: auth_password_reset_request_create
      description: Always answers 202 with the same message, whether or not the email
        exists.
      summary: Request a password-reset email
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      summary: Rotate a refresh token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refresh'
          description: ''
  /api/v1/auth/register:
    post:
      operationId: auth_register_create
      summary: Register a new account
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
  /api/v1/geo/cities:
    get:
      operationId: geo_cities_list
      summary: Active cities (filter by governorate)
      parameters:
      - in: query
        name: governorate
        schema:
          type: string
          format: uuid
      tags:
      - geography
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'
          description: ''
  /api/v1/geo/countries:
    get:
      operationId: geo_countries_list
      summary: Active countries
      tags:
      - geography
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'
          description: ''
  /api/v1/geo/governorates:
    get:
      operationId: geo_governorates_list
      summary: Active governorates (filter by country)
      parameters:
      - in: query
        name: country
        schema:
          type: string
          format: uuid
      tags:
      - geography
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Governorate'
          description: ''
  /api/v1/me:
    get:
      operationId: me_retrieve
      description: Canonical source of the current user's identity, role and permissions.
      summary: Current account
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
    patch:
      operationId: me_partial_update
      description: Canonical source of the current user's identity, role and permissions.
      summary: Update current account
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccountUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccountUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /api/v1/providers:
    get:
      operationId: providers_list
      summary: Discover providers (verified and visible only)
      parameters:
      - in: query
        name: city
        schema:
          type: string
        description: City id
      - in: query
        name: governorate
        schema:
          type: string
        description: Governorate id
      - in: query
        name: kind
        schema:
          type: string
        description: PRACTITIONER or FACILITY
      - in: query
        name: ordering
        schema:
          type: string
        description: display_name | -display_name | created_at | -created_at
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Matches display name
      - in: query
        name: specialty
        schema:
          type: string
        description: Specialty slug
      - in: query
        name: type
        schema:
          type: string
        description: Provider type code, e.g. DOCTOR
      tags:
      - providers
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProviderCardList'
          description: ''
  /api/v1/providers/{id}:
    get:
      operationId: providers_retrieve
      summary: Public provider profile
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - providers
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPublic'
          description: ''
  /api/v1/providers/me:
    get:
      operationId: providers_me_retrieve
      description: Create, read and update the caller's own provider profile.
      summary: My provider profile
      tags:
      - provider-self
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderOwner'
          description: ''
    post:
      operationId: providers_me_create
      description: Create, read and update the caller's own provider profile.
      summary: Create my provider profile (onboarding)
      tags:
      - provider-self
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProviderWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderOwner'
          description: ''
    patch:
      operationId: providers_me_partial_update
      description: Create, read and update the caller's own provider profile.
      summary: Update my provider profile
      tags:
      - provider-self
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProviderWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProviderWriteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderOwner'
          description: ''
  /api/v1/providers/me/memberships:
    get:
      operationId: providers_me_memberships_list
      summary: My memberships (both sides)
      parameters:
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: مصطلح البحث.
        schema:
          type: string
      tags:
      - provider-self
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Membership'
          description: ''
    post:
      operationId: providers_me_memberships_create
      summary: Request to join a facility / invite a practitioner
      tags:
      - provider-self
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MembershipCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
  /api/v1/providers/me/memberships/{id}/accept:
    post:
      operationId: providers_me_memberships_accept_create
      summary: Accept a pending membership (counterpart only)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - provider-self
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
  /api/v1/providers/me/memberships/{id}/end:
    post:
      operationId: providers_me_memberships_end_create
      summary: End an active membership
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - provider-self
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
  /api/v1/providers/me/memberships/{id}/reject:
    post:
      operationId: providers_me_memberships_reject_create
      summary: Reject or withdraw a pending membership
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - provider-self
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
  /api/v1/providers/me/services:
    get:
      operationId: providers_me_services_list
      summary: My service offerings
      parameters:
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: مصطلح البحث.
        schema:
          type: string
      tags:
      - provider-self
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceOffering'
          description: ''
    post:
      operationId: providers_me_services_create
      summary: Add a service offering
      tags:
      - provider-self
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceOfferingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ServiceOfferingRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOffering'
          description: ''
  /api/v1/providers/me/services/{id}:
    get:
      operationId: providers_me_services_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - provider-self
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOffering'
          description: ''
    patch:
      operationId: providers_me_services_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - provider-self
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedServiceOfferingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedServiceOfferingRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOffering'
          description: ''
    delete:
      operationId: providers_me_services_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - provider-self
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/providers/me/verification/request:
    post:
      operationId: providers_me_verification_request_create
      summary: Request verification of my profile
      tags:
      - provider-self
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderOwner'
          description: ''
  /api/v1/specialties:
    get:
      operationId: specialties_list
      summary: Active specialties (unpaginated)
      parameters:
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: مصطلح البحث.
        schema:
          type: string
      tags:
      - specialties
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Specialty'
          description: ''
components:
  schemas:
    Account:
      type: object
      description: Read-only representation. Never includes password or privilege
        internals.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        full_name:
          type: string
          readOnly: true
        phone_number:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/AccountRoleEnum'
          readOnly: true
        preferred_language:
          allOf:
          - $ref: '#/components/schemas/PreferredLanguageEnum'
          readOnly: true
        email_verified:
          type: boolean
          readOnly: true
        email_verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        has_password:
          type: boolean
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
          description: Grants access to the Django admin site.
        permissions:
          type: array
          items:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: آخر دخول
      required:
      - created_at
      - email
      - email_verified
      - email_verified_at
      - full_name
      - has_password
      - id
      - is_staff
      - last_login
      - permissions
      - phone_number
      - preferred_language
      - role
    AccountRoleEnum:
      enum:
      - PATIENT
      - PROVIDER
      - MEDICAL_COMPANY
      - REAL_ESTATE_SELLER
      - ADMIN
      type: string
      description: |-
        * `PATIENT` - Patient
        * `PROVIDER` - Healthcare provider
        * `MEDICAL_COMPANY` - Medical company / supplier
        * `REAL_ESTATE_SELLER` - Medical real-estate owner or agent
        * `ADMIN` - Racheeta administrator
    City:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        governorate:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        name_ar:
          type: string
          readOnly: true
        name_en:
          type: string
          readOnly: true
      required:
      - governorate
      - id
      - name_ar
      - name_en
      - slug
    Country:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          readOnly: true
          description: ISO 3166-1 alpha-2
        name_ar:
          type: string
          readOnly: true
        name_en:
          type: string
          readOnly: true
      required:
      - code
      - id
      - name_ar
      - name_en
    Detail:
      type: object
      properties:
        detail:
          type: string
          readOnly: true
      required:
      - detail
    EmailVerificationConfirmRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 64
        token:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - token
      - uid
    FirebaseExchangeRequest:
      type: object
      properties:
        id_token:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
        role:
          allOf:
          - $ref: '#/components/schemas/SelfRegistrationRoleEnum'
          description: |-
            Role for a newly created account. Ignored for existing accounts.

            * `PATIENT` - Patient
            * `PROVIDER` - Healthcare provider
            * `MEDICAL_COMPANY` - Medical company / supplier
            * `REAL_ESTATE_SELLER` - Medical real-estate owner or agent
      required:
      - id_token
    FirebaseExchangeResponse:
      type: object
      properties:
        account:
          allOf:
          - $ref: '#/components/schemas/Account'
          readOnly: true
        tokens:
          allOf:
          - $ref: '#/components/schemas/TokenPair'
          readOnly: true
        created:
          type: boolean
          readOnly: true
      required:
      - account
      - created
      - tokens
    Governorate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        country:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        name_ar:
          type: string
          readOnly: true
        name_en:
          type: string
          readOnly: true
      required:
      - country
      - id
      - name_ar
      - name_en
      - slug
    InitiatedByEnum:
      enum:
      - PRACTITIONER
      - FACILITY
      type: string
      description: |-
        * `PRACTITIONER` - Practitioner
        * `FACILITY` - Facility
    LoginRequest:
      type: object
      description: Email + password -> access/refresh pair. Registered via SIMPLE_JWT.
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
    Membership:
      type: object
      properties:

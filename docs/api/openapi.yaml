    PushDeviceRegisterRequest:
      type: object
      description: |-
        The only client input: the opaque FCM token, a bounded platform and the ownership
        sequence. Ownership is always the authenticated caller; there is no account field.
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 1024
        platform:
          $ref: '#/components/schemas/PushPlatformEnum'
        ownership_seq:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
          description: 'Client ownership sequence: strictly increasing per installation
            (persisted by the client, never reset by an account switch, logout or
            restart). Under the token lock an operation is applied only if its value
            is greater than the one stored for the token; an older, equal or missing
            value on a sequenced token changes nothing.'
      required:
      - platform
      - token
    PushDeviceUnregisterRequest:
      type: object
      description: Reject undeclared client fields instead of silently ignoring them.
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 1024
        ownership_seq:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
          description: 'Client ownership sequence: strictly increasing per installation
            (persisted by the client, never reset by an account switch, logout or
            restart). Under the token lock an operation is applied only if its value
            is greater than the one stored for the token; an older, equal or missing
            value on a sequenced token changes nothing.'
        platform:
          allOf:
          - $ref: '#/components/schemas/PushPlatformEnum'
          description: |-
            Only used when a sequenced unregister arrives for a token the server has not seen yet and must leave an inactive ordering marker (default ANDROID).

            * `ANDROID` - Android
            * `IOS` - iOS
            * `WEB` - Web
      required:
      - token
    PushPlatformEnum:
      enum:
      - ANDROID
      - IOS
      - WEB
      type: string
      description: |-
        * `ANDROID` - Android
        * `IOS` - iOS
        * `WEB` - Web

  /api/v1/talent/invitations:
    get:
      operationId: talent_invitations_list
      description: |-
        Invitations sent by my organisation, newest first, on the standard
        paginated envelope. The rows stay stored when a candidate hides their
        profile; a row is listed (and its candidate card serialised) only while the
        shared visibility rule `_visible_candidates` allows it, so `count` is the
        number of rows the employer may actually see.
      summary: Invitations sent by my organisation (paginated, newest first)
      parameters:
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      tags:
      - talent
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvitationList'
          description: ''
    post:
      operationId: talent_invitations_create
      description: |-
        Invitations sent by my organisation, newest first, on the standard
        paginated envelope. The rows stay stored when a candidate hides their
        profile; a row is listed (and its candidate card serialised) only while the
        shared visibility rule `_visible_candidates` allows it, so `count` is the
        number of rows the employer may actually see.
      summary: Invite a discoverable candidate to apply to one of my open jobs (quota-consuming)
      tags:
      - talent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InviteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''

              $ref: '#/components/schemas/InviteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
  /api/v1/talent/invitations/{id}/cancel:
    post:
      operationId: talent_invitations_cancel_create
      summary: Cancel a pending invitation
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - talent
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
  /api/v1/talent/saved:
    get:
      operationId: talent_saved_list
      description: |-
        Saved candidates, newest first, on the standard paginated envelope.
        The relation stays stored when a candidate hides their profile; the
        professional card is returned only while `_visible_candidates` allows it.
      summary: My organisation's saved candidates (paginated, newest first)
      parameters:
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      tags:
      - talent
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSavedCandidateList'
          description: ''
    post:
      operationId: talent_saved_create
      description: |-
        Saved candidates, newest first, on the standard paginated envelope.
        The relation stays stored when a candidate hides their profile; the
        professional card is returned only while `_visible_candidates` allows it.
      summary: Save a candidate (private note never shown to the candidate)
      tags:
      - talent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveCandidateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SaveCandidateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedCandidate'
          description: ''
  /api/v1/talent/saved/{id}:
    delete:
      operationId: talent_saved_destroy
      summary: Remove a saved candidate
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - talent
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    Account:
      type: object
      description: Read-only representation. Never includes password or privilege
        internals.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        full_name:
          type: string
          readOnly: true
        phone_number:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/AccountRoleEnum'
          readOnly: true
        preferred_language:
          allOf:
          - $ref: '#/components/schemas/PreferredLanguageEnum'
          readOnly: true
        email_verified:
          type: boolean
          readOnly: true
        email_verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        has_password:
          type: boolean
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
          description: Grants access to the Django admin site.
        permissions:
          type: array
          items:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: آخر دخول
      required:
      - created_at
      - email
      - email_verified
      - email_verified_at
      - full_name
      - has_password
      - id
      - is_staff
      - last_login
      - permissions
      - phone_number
      - preferred_language
      - role
    AccountRoleEnum:
      enum:
      - PATIENT
      - PROVIDER
      - MEDICAL_COMPANY
      - REAL_ESTATE_SELLER
      - ADMIN
      type: string
      description: |-
        * `PATIENT` - Patient
        * `PROVIDER` - Healthcare provider
        * `MEDICAL_COMPANY` - Medical company / supplier
        * `REAL_ESTATE_SELLER` - Medical real-estate owner or agent
        * `ADMIN` - Racheeta administrator
    ActivateRequest:
      type: object
      properties:
        term_days:
          type: integer
          maximum: 3660
          minimum: 1
        reference:
          type: string
          default: ''
          maxLength: 120
        note:
          type: string
          default: ''
          maxLength: 500
        payment:
          $ref: '#/components/schemas/ActivationPaymentRequest'
    ActivationPaymentRequest:
      type: object
      description: |-
        The payment an administrator verified before activating. Its status is
        not an input: activation succeeds only for a verified payment, so the
        server records VERIFIED (see ActivateSerializer.validate).
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        currency:
          type: string
          minLength: 1
          maxLength: 3
        method:
          $ref: '#/components/schemas/MethodEnum'
        reference:
          type: string
          maxLength: 120
        note:
          type: string
          maxLength: 500
    AdminCompany:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        account_email:
          type: string
          format: email
      required:
      - account_email
      - id
      - name
    AdminDecisionRequest:
      type: object
      properties:
        note:
          type: string
          default: ''
          maxLength: 500
    AdminPayment:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/CampaignPaymentStatusEnum'
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          readOnly: true
        method:
          allOf:
          - $ref: '#/components/schemas/MethodEnum'
          readOnly: true
        reference:
          type: string
          readOnly: true
        admin_note:
          type: string
          readOnly: true
        verified_by_email:
          type: string
          format: email
          readOnly: true
        verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - admin_note
      - amount
      - created_at
      - currency
      - method
      - reference
      - status
      - verified_at
      - verified_by_email
    AdminSubscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        billing_account_id:
          type: string
          format: uuid
          readOnly: true
        subject_type:
          type: string
          readOnly: true
        subject_id:
          type: string
          format: uuid
          readOnly: true
        plan:
          allOf:
          - $ref: '#/components/schemas/Plan'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/SubscriptionStatusEnum'
          readOnly: true
        requested_by_email:
          type: string
          format: email
          readOnly: true
        requester_note:
          type: string
          readOnly: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        admin_reference:
          type: string
          readOnly: true
          description: External payment/agreement reference
        admin_note:
          type: string
          readOnly: true
        events:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionEvent'
          readOnly: true
        payments:
          type: array
          items:
            $ref: '#/components/schemas/PaymentRecord'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - admin_note
      - admin_reference
      - billing_account_id
      - created_at
      - ends_at
      - events
      - id
      - payments
      - plan
      - requested_by_email
      - requester_note
      - starts_at
      - status
      - subject_id
      - subject_type
    ApplicationEmployer:
      type: object
      description: |-
        Employer's view of an applicant: snapshot + current professional profile.
        Never contact data.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        job_id:
          type: string
          format: uuid
          readOnly: true
        job_title:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
        cover_text:
          type: string
          readOnly: true
        snapshot:
          readOnly: true
          description: Professional summary frozen at application time (no contact
            data)
        candidate:
          allOf:
          - $ref: '#/components/schemas/TalentCard'
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        transitions:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationTransition'
          readOnly: true
        interviews:
          type: array
          items:
            $ref: '#/components/schemas/InterviewRequest'
          readOnly: true
      required:
      - candidate
      - cover_text
      - id
      - interviews
      - job_id
      - job_title
      - snapshot
      - status
      - submitted_at
      - transitions
    ApplicationSeeker:
      type: object
      description: Job seeker's own application.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        job:
          allOf:
          - $ref: '#/components/schemas/JobCard'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
        cover_text:
          type: string
          readOnly: true
        snapshot:
          readOnly: true
          description: Professional summary frozen at application time (no contact
            data)
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        transitions:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationTransition'
          readOnly: true
        interviews:
          type: array
          items:
            $ref: '#/components/schemas/InterviewRequest'
          readOnly: true
      required:
      - cover_text
      - id
      - interviews
      - job
      - snapshot
      - status
      - submitted_at
      - transitions
    ApplicationStatusEnum:
      enum:
      - SUBMITTED
      - REVIEWING
      - SHORTLISTED
      - INTERVIEW
      - ACCEPTED
      - REJECTED
      - WITHDRAWN
      type: string
      description: |-
        * `SUBMITTED` - Submitted
        * `REVIEWING` - Reviewing
        * `SHORTLISTED` - Shortlisted
        * `INTERVIEW` - Interview
        * `ACCEPTED` - Accepted
        * `REJECTED` - Rejected
        * `WITHDRAWN` - Withdrawn
    ApplicationTransition:
      type: object

      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    Account:
      type: object
      description: Read-only representation. Never includes password or privilege
        internals.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        full_name:
          type: string
          readOnly: true
        phone_number:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/AccountRoleEnum'
          readOnly: true
        preferred_language:
          allOf:
          - $ref: '#/components/schemas/PreferredLanguageEnum'
          readOnly: true
        email_verified:
          type: boolean
          readOnly: true
        email_verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        has_password:
          type: boolean
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
          description: Grants access to the Django admin site.
        permissions:
          type: array
          items:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: آخر دخول
      required:
      - created_at
      - email
      - email_verified
      - email_verified_at
      - full_name
      - has_password
      - id
      - is_staff
      - last_login
      - permissions
      - phone_number
      - preferred_language
      - role
    AccountRoleEnum:
      enum:
      - PATIENT
      - PROVIDER
      - MEDICAL_COMPANY
      - REAL_ESTATE_SELLER
      - ADMIN
      type: string
      description: |-
        * `PATIENT` - Patient
        * `PROVIDER` - Healthcare provider
        * `MEDICAL_COMPANY` - Medical company / supplier
        * `REAL_ESTATE_SELLER` - Medical real-estate owner or agent
        * `ADMIN` - Racheeta administrator
    ActivateRequest:
      type: object
      properties:
        term_days:
          type: integer
          maximum: 3660
          minimum: 1
        reference:
          type: string
          default: ''
          maxLength: 120
        note:
          type: string
          default: ''
          maxLength: 500
        payment:
          $ref: '#/components/schemas/PaymentRecordRequest'
    AdminDecisionRequest:
      type: object
      properties:
        note:
          type: string
          default: ''
          maxLength: 500
    AdminSubscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        billing_account_id:
          type: string
          format: uuid
          readOnly: true
        subject_type:
          type: string
          readOnly: true
        subject_id:
          type: string
          format: uuid
          readOnly: true
        plan:
          allOf:
          - $ref: '#/components/schemas/Plan'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/SubscriptionStatusEnum'
          readOnly: true
        requested_by_email:
          type: string
          format: email
          readOnly: true
        requester_note:
          type: string
          readOnly: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        admin_reference:
          type: string
          readOnly: true
          description: External payment/agreement reference
        admin_note:
          type: string
          readOnly: true
        events:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionEvent'
          readOnly: true
        payments:
          type: array
          items:
            $ref: '#/components/schemas/PaymentRecord'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - admin_note
      - admin_reference
      - billing_account_id
      - created_at
      - ends_at
      - events
      - id
      - payments
      - plan
      - requested_by_email
      - requester_note
      - starts_at
      - status
      - subject_id
      - subject_type
    ApplicationEmployer:
      type: object
      description: |-
        Employer's view of an applicant: snapshot + current professional profile.
        Never contact data.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        job_id:
          type: string
          format: uuid
          readOnly: true
        job_title:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
        cover_text:
          type: string
          readOnly: true
        snapshot:
          readOnly: true
          description: Professional summary frozen at application time (no contact
            data)
        candidate:
          allOf:
          - $ref: '#/components/schemas/TalentCard'
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        transitions:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationTransition'
          readOnly: true
        interviews:
          type: array
          items:
            $ref: '#/components/schemas/InterviewRequest'
          readOnly: true
      required:
      - candidate
      - cover_text
      - id
      - interviews
      - job_id
      - job_title
      - snapshot
      - status
      - submitted_at
      - transitions
    ApplicationSeeker:
      type: object
      description: Job seeker's own application.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        job:
          allOf:
          - $ref: '#/components/schemas/JobCard'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
        cover_text:
          type: string
          readOnly: true
        snapshot:
          readOnly: true
          description: Professional summary frozen at application time (no contact
            data)
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        transitions:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationTransition'
          readOnly: true
        interviews:
          type: array
          items:
            $ref: '#/components/schemas/InterviewRequest'
          readOnly: true
      required:
      - cover_text
      - id
      - interviews
      - job
      - snapshot
      - status
      - submitted_at
      - transitions
    ApplicationStatusEnum:
      enum:
      - SUBMITTED
      - REVIEWING
      - SHORTLISTED
      - INTERVIEW
      - ACCEPTED
      - REJECTED
      - WITHDRAWN
      type: string
      description: |-
        * `SUBMITTED` - Submitted
        * `REVIEWING` - Reviewing
        * `SHORTLISTED` - Shortlisted
        * `INTERVIEW` - Interview
        * `ACCEPTED` - Accepted
        * `REJECTED` - Rejected
        * `WITHDRAWN` - Withdrawn
    ApplicationTransition:
      type: object
      properties:
        from_status:
          type: string
          readOnly: true
        to_status:
          type: string
          readOnly: true
        reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - from_status
      - reason
      - to_status
    ApplicationTransitionRequestRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ApplicationTransitionRequestStatusEnum'
        reason:
          type: string
          default: ''
          maxLength: 500
      required:
      - status
    ApplicationTransitionRequestStatusEnum:
      enum:
      - REVIEWING
      - SHORTLISTED
      - ACCEPTED
      - REJECTED
      type: string
      description: |-
        * `REVIEWING` - Reviewing
        * `SHORTLISTED` - Shortlisted
        * `ACCEPTED` - Accepted
        * `REJECTED` - Rejected
    ApplyRequest:
      type: object
      properties:
        cover_text:
          type: string
          default: ''
          maxLength: 2000
    AudienceEnum:
      enum:
      - EMPLOYER
      - JOB_SEEKER
      type: string
      description: |-
        * `EMPLOYER` - Employer organisation
        * `JOB_SEEKER` - Job seeker
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        action:
          type: string
          readOnly: true
          description: dotted code, e.g. billing.subscription.activated
        target_type:
          type: string
          readOnly: true
        target_id:
          type: string
          readOnly: true
        summary:
          type: string
          readOnly: true
        data:
          readOnly: true
        actor_email:
          type: string
          format: email
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor_email
      - created_at
      - data
      - id
      - summary
      - target_id
      - target_type
    AvailabilityEnum:
      enum:
      - IMMEDIATE
      - WITHIN_MONTH
      - WITHIN_3_MONTHS
      - NOT_AVAILABLE
      type: string
      description: |-
        * `IMMEDIATE` - Immediately
        * `WITHIN_MONTH` - Within a month
        * `WITHIN_3_MONTHS` - Within three months
        * `NOT_AVAILABLE` - Not currently available
    BillingPeriodEnum:
      enum:
      - NONE
      - MONTHLY
      - QUARTERLY
      - YEARLY
      type: string
      description: |-
        * `NONE` - No renewal (default / trial)
        * `MONTHLY` - Monthly
        * `QUARTERLY` - Quarterly
        * `YEARLY` - Yearly
    BillingSummary:
      type: object
      description: What a subject sees about its own commercial state. No admin notes.
      properties:
        plan:
          allOf:
          - $ref: '#/components/schemas/Plan'
          nullable: true
        subscription:
          allOf:
          - $ref: '#/components/schemas/Subscription'
          nullable: true
        pending_subscription:
          allOf:
          - $ref: '#/components/schemas/Subscription'
          nullable: true
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/Entitlement'
        requestable_plans:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
      required:
      - entitlements
      - pending_subscription
      - plan
      - requestable_plans
      - subscription
    BlankEnum:
      enum:
      - ''
    City:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        governorate:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        name_ar:
          type: string
          readOnly: true
        name_en:
          type: string
          readOnly: true
      required:
      - governorate
      - id
      - name_ar
      - name_en
      - slug
    Country:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          readOnly: true
          description: ISO 3166-1 alpha-2
        name_ar:
          type: string
          readOnly: true
        name_en:
          type: string
          readOnly: true
      required:
      - code
      - id
      - name_ar
      - name_en
    Credential:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          $ref: '#/components/schemas/CredentialKindEnum'
        name:
          type: string
          maxLength: 150
        issuer:
          type: string
          maxLength: 150
        year:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
      required:
      - id
      - kind
      - name
    CredentialKindEnum:
      enum:
      - LICENSE
      - CERTIFICATION
      type: string
      description: |-
        * `LICENSE` - Professional licence
        * `CERTIFICATION` - Training / certification
    CredentialRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/CredentialKindEnum'
        name:
          type: string
          minLength: 1
          maxLength: 150
        issuer:
          type: string
          maxLength: 150
        year:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
      required:
      - kind
      - name
    CreditBalance:
      type: object
      properties:
        key:
          type: string
          readOnly: true
        balance:
          type: integer
          readOnly: true
      required:
      - balance
      - key
    CreditGrantRequest:
      type: object
      properties:
        billing_account:
          type: string
          format: uuid
        key:
          type: string
          minLength: 1
          maxLength: 60
        amount:
          type: integer
          maximum: 100000
          minimum: -100000
        note:
          type: string
          default: ''
          maxLength: 500

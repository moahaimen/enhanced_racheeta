        to_status:
          type: string
          readOnly: true
        reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - from_status
      - reason
      - to_status
    ApplicationTransitionRequestRequest:
      type: object

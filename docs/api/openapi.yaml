openapi: 3.0.3
info:
  title: Racheeta API
  version: 1.0.0
  description: Racheeta 2.0 — canonical API consumed by web, mobile and dashboards.
paths:
  /api/v1/admin/advertising/campaigns:
    get:
      operationId: admin_advertising_campaigns_list
      summary: 'All campaigns (paginated; filters: status, company, payment_status)'
      parameters:
      - in: query
        name: company
        schema:
          type: string
          format: uuid
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: payment_status
        schema:
          type: string
          enum:
          - PENDING
          - REJECTED
          - VERIFIED
        description: |-
          * `PENDING` - Pending
          * `VERIFIED` - Verified
          * `REJECTED` - Rejected
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - CANCELLED
          - DRAFT
          - PENDING_PAYMENT
          - REJECTED
        description: |-
          * `DRAFT` - Draft
          * `PENDING_PAYMENT` - Pending payment verification
          * `ACTIVE` - Active
          * `REJECTED` - Rejected
          * `CANCELLED` - Cancelled
      tags:
      - admin-advertising
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCampaignAdminList'
          description: ''
  /api/v1/admin/advertising/campaigns/{id}:
    get:
      operationId: admin_advertising_campaigns_retrieve
      summary: One campaign with its payment
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin-advertising
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignAdmin'
          description: ''
  /api/v1/admin/advertising/campaigns/{id}/reject-payment:
    post:
      operationId: admin_advertising_campaigns_reject_payment_create
      summary: 'Reject the payment: the campaign becomes REJECTED (history)'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin-advertising
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRejectionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentRejectionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignAdmin'
          description: ''
  /api/v1/admin/advertising/campaigns/{id}/verify-payment:
    post:
      operationId: admin_advertising_campaigns_verify_payment_create
      summary: 'Verify the off-platform payment: the campaign becomes ACTIVE'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin-advertising
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentVerificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentVerificationRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignAdmin'
          description: ''
  /api/v1/admin/audit:
    get:
      operationId: admin_audit_list
      summary: Audit history (administrators)
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: action__startswith
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: target_id
        schema:
          type: string
      - in: query
        name: target_type
        schema:
          type: string
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/v1/admin/billing/accounts/{id}:
    get:
      operationId: admin_billing_accounts_retrieve
      summary: Entitlement state of a billing account (administrators)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSummary'
          description: ''
  /api/v1/admin/billing/credits:
    post:
      operationId: admin_billing_credits_create
      summary: Grant or revoke extra credits for an entitlement key
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditGrantRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreditGrantRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditBalance'
          description: ''
  /api/v1/admin/billing/subscriptions:
    get:
      operationId: admin_billing_subscriptions_list
      summary: Subscriptions (administrators)
      parameters:
      - in: query
        name: billing_account__subject_type
        schema:
          type: string
          enum:
          - account
          - organization
        description: |-
          * `organization` - Organisation
          * `account` - Account
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: plan__code
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - CANCELLED
          - EXPIRED
          - PENDING
          - REJECTED
          - SUSPENDED
        description: |-
          * `PENDING` - Pending administrator approval
          * `ACTIVE` - Active
          * `SUSPENDED` - Suspended
          * `CANCELLED` - Cancelled
          * `EXPIRED` - Expired
          * `REJECTED` - Rejected
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminSubscriptionList'
          description: ''
  /api/v1/admin/billing/subscriptions/{id}/activate:
    post:
      operationId: admin_billing_subscriptions_activate_create
      summary: Activate a subscription after verifying payment manually
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSubscription'
          description: ''
  /api/v1/admin/billing/subscriptions/{id}/cancel:
    post:
      operationId: admin_billing_subscriptions_cancel_create
      summary: Cancel a subscription
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSubscription'
          description: ''
  /api/v1/admin/billing/subscriptions/{id}/reject:
    post:
      operationId: admin_billing_subscriptions_reject_create
      summary: Reject a pending subscription request
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSubscription'
          description: ''
  /api/v1/admin/billing/subscriptions/{id}/suspend:
    post:
      operationId: admin_billing_subscriptions_suspend_create
      summary: Suspend an active subscription
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSubscription'
          description: ''
  /api/v1/admin/commerce/coupons:
    get:
      operationId: admin_commerce_coupons_list
      summary: All coupons (Racheeta- and seller-funded)
      parameters:
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: مصطلح البحث.
        schema:
          type: string
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCouponList'
          description: ''
    post:
      operationId: admin_commerce_coupons_create
      summary: 'Create a Racheeta coupon (platform-funded: the seller is paid in full)'
      tags:
      - finance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CouponCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
          description: ''
  /api/v1/admin/commerce/coupons/{id}/deactivate:
    post:
      operationId: admin_commerce_coupons_deactivate_create
      summary: Stop a Racheeta coupon
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
          description: ''
  /api/v1/admin/commerce/disputes:
    get:
      operationId: admin_commerce_disputes_list
      summary: Disputes
      parameters:
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: مصطلح البحث.
        schema:
          type: string
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDisputeList'
          description: ''
  /api/v1/admin/commerce/disputes/{id}/resolve:
    post:
      operationId: admin_commerce_disputes_resolve_create
      summary: Resolve a dispute (with or without a full refund of what remains)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - finance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeResolveRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DisputeResolveRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
          description: ''
  /api/v1/admin/commerce/orders:
    get:
      operationId: admin_commerce_orders_list
      summary: All marketplace orders (filterable)
      parameters:
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: مصطلح البحث.
        schema:
          type: string
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminOrderList'
          description: ''
  /api/v1/admin/commerce/orders/{id}:
    get:
      operationId: admin_commerce_orders_retrieve
      summary: One marketplace order
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
          description: ''
  /api/v1/admin/commerce/orders/{id}/complete:
    post:
      operationId: admin_commerce_orders_complete_create
      summary: 'Complete a paid, delivered order: accrue the 20% commission and the
        seller payable'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
          description: ''
  /api/v1/admin/commerce/orders/{id}/confirm-delivery:
    post:
      operationId: admin_commerce_orders_confirm_delivery_create
      summary: Confirm delivery on the buyer's behalf (courier proof)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
          description: ''
  /api/v1/admin/commerce/orders/{id}/refund-cancelled:
    post:
      operationId: admin_commerce_orders_refund_cancelled_create
      summary: Refund a paid order that was cancelled (simulated)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
          description: ''
  /api/v1/admin/commerce/orders/{id}/verify-payment:
    post:
      operationId: admin_commerce_orders_verify_payment_create
      summary: Record SIMULATED payment evidence (no real money) — posts the payment
        entry once
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - finance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPaymentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyPaymentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
          description: ''
  /api/v1/admin/commerce/reports/marketplace:
    get:
      operationId: admin_commerce_reports_marketplace_retrieve
      summary: Marketplace accounting report per seller (JSON or CSV)
      parameters:
      - in: query
        name: export
        schema:
          type: string
        description: csv to download a spreadsheet
      - in: query
        name: from
        schema:
          type: string
        description: 'YYYY-MM-DD (default: 90 days ago)'
      - in: query
        name: to
        schema:
          type: string
        description: 'YYYY-MM-DD (default: today)'
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/commerce/returns:
    get:
      operationId: admin_commerce_returns_list
      summary: Return requests (all sellers)
      parameters:
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: مصطلح البحث.
        schema:
          type: string
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReturnList'
          description: ''
  /api/v1/admin/commerce/returns/{id}/refund:
    post:
      operationId: admin_commerce_returns_refund_create
      summary: Refund a received return (proportional compensating entry)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
          description: ''
  /api/v1/admin/ledger/entries:
    get:
      operationId: admin_ledger_entries_list
      summary: Ledger entries (immutable, newest first)
      parameters:
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: مصطلح البحث.
        schema:
          type: string
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLedgerEntryList'
          description: ''
  /api/v1/admin/ledger/payables:
    get:
      operationId: admin_ledger_payables_list
      summary: What Racheeta owes each seller, and what each seller owes Racheeta,
        right now
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SellerPayable'
          description: ''
  /api/v1/admin/ledger/policy:
    get:
      operationId: admin_ledger_policy_list
      description: Commission policy versions (read-only here; a new version is a
        reviewed migration).
      summary: Commission policy versions (current first)
      parameters:
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: مصطلح البحث.
        schema:
          type: string
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Policy'
          description: ''
  /api/v1/admin/ledger/reconciliation:
    get:
      operationId: admin_ledger_reconciliation_retrieve
      summary: 'Ledger reconciliation: balances re-derived from orders, settlements
        and refunds'
      tags:
      - finance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reconciliation'
          description: ''
  /api/v1/admin/ledger/recoveries:
    get:
      operationId: admin_ledger_recoveries_list
      description: Recoveries from sellers (refunds after payout that the seller paid
        back; simulated).
      summary: Amounts recovered from sellers (simulated)
      parameters:
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:

  /api/v1/notifications/push-devices/:
    post:
      operationId: notifications_push_devices_create
      description: 'Idempotent upsert owned by the authenticated caller. If the token
        was registered by another account it is transferred to the caller and the
        previous owner stops receiving pushes through it. The token is never returned.
        Ordering: the request carries a client `ownership_seq`; under the token lock
        it is applied only if it is greater than the stored one. An older, equal (by
        a different owner) or missing sequence on a sequenced token changes nothing
        and is answered 409 `stale_ownership`; an exact replay by the owner is returned
        unchanged (200).'
      summary: Register or refresh this device's push token
      tags:
      - notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushDeviceRegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PushDeviceRegisterRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushDevice'
          description: ''
        '409':
          description: '`stale_ownership`: a newer operation governs the token.'
  /api/v1/notifications/push-devices/unregister/:
    post:
      operationId: notifications_push_devices_unregister_create
      description: Deactivates the caller's own registration of this token. Tokens
        that are unknown or owned by someone else change nothing and are answered
        identically (204), and so do stale ones. With an `ownership_seq` greater than
        the stored one the owner's registration is deactivated and the sequence stored,
        so an older register arriving later cannot resurrect it; for a token the server
        has not seen yet an inactive ordering marker is recorded.
      summary: Unregister this device's push token (call before logout)
      tags:
      - notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushDeviceUnregisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PushDeviceUnregisterRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body

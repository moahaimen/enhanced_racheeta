          type: integer
      - in: query
        name: property_type
        schema:
          type: string
          enum:
          - APARTMENT_FOR_CLINIC
          - CLINIC
          - COMMERCIAL_MEDICAL_PROPERTY
          - HOSPITAL_BUILDING
          - LABORATORY_LOCATION
          - MEDICAL_BUILDING
          - MEDICAL_CENTER
          - MEDICAL_INVESTMENT_LAND
          - PHARMACY_LOCATION
        description: |-
          * `CLINIC` - Clinic
          * `APARTMENT_FOR_CLINIC` - Apartment suitable for a clinic
          * `MEDICAL_BUILDING` - Medical building
          * `PHARMACY_LOCATION` - Pharmacy location
          * `LABORATORY_LOCATION` - Laboratory location
          * `MEDICAL_CENTER` - Medical center
          * `HOSPITAL_BUILDING` - Hospital building
          * `COMMERCIAL_MEDICAL_PROPERTY` - Commercial property suitable for medical use
          * `MEDICAL_INVESTMENT_LAND` - Land for medical investment
      - name: search
        required: false
        in: query
        description: مصطلح البحث.
        schema:
          type: string
      - in: query
        name: suitable_use
        schema:
          type: string
          enum:
          - CLINIC
          - GENERAL_MEDICAL_USE
          - HOSPITAL
          - LABORATORY
          - MEDICAL_CENTER
          - MEDICAL_INVESTMENT
          - PHARMACY
        description: |-
          * `CLINIC` - Clinic
          * `PHARMACY` - Pharmacy
          * `LABORATORY` - Laboratory
          * `MEDICAL_CENTER` - Medical center
          * `HOSPITAL` - Hospital
          * `GENERAL_MEDICAL_USE` - General medical use
          * `MEDICAL_INVESTMENT` - Medical investment
      - in: query
        name: transaction_type
        schema:
          type: string
          enum:
          - RENT
          - SALE
        description: |-
          * `SALE` - Sale
          * `RENT` - Rent

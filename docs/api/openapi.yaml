          format: uuid
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        name_ar:
          type: string
          readOnly: true
        name_en:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - governorate
      - id
      - is_active
      - name_ar
      - name_en
      - slug

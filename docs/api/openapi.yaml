openapi: 3.0.3
info:
  title: Racheeta API
  version: 1.0.0
  description: Racheeta 2.0 — canonical API consumed by web, mobile and dashboards.
paths:
  /api/v1/admin/advertising/campaigns:
    get:
      operationId: admin_advertising_campaigns_list
      summary: 'All campaigns (paginated; filters: status, company, payment_status)'
      parameters:
      - in: query
        name: company
        schema:
          type: string
          format: uuid
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: payment_status
        schema:
          type: string
          enum:
          - PENDING
          - REJECTED
          - VERIFIED
        description: |-
          * `PENDING` - Pending
          * `VERIFIED` - Verified
          * `REJECTED` - Rejected
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - CANCELLED
          - DRAFT
          - PENDING_PAYMENT
          - REJECTED
        description: |-
          * `DRAFT` - Draft
          * `PENDING_PAYMENT` - Pending payment verification
          * `ACTIVE` - Active
          * `REJECTED` - Rejected
          * `CANCELLED` - Cancelled
      tags:
      - admin-advertising
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCampaignAdminList'
          description: ''
  /api/v1/admin/advertising/campaigns/{id}:
    get:
      operationId: admin_advertising_campaigns_retrieve
      summary: One campaign with its payment
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin-advertising
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignAdmin'
          description: ''
  /api/v1/admin/advertising/campaigns/{id}/reject-payment:
    post:
      operationId: admin_advertising_campaigns_reject_payment_create
      summary: 'Reject the payment: the campaign becomes REJECTED (history)'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin-advertising
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRejectionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentRejectionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignAdmin'
          description: ''
  /api/v1/admin/advertising/campaigns/{id}/verify-payment:
    post:
      operationId: admin_advertising_campaigns_verify_payment_create
      summary: 'Verify the off-platform payment: the campaign becomes ACTIVE'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin-advertising
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentVerificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentVerificationRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignAdmin'
          description: ''
  /api/v1/admin/audit:
    get:
      operationId: admin_audit_list
      summary: Audit history (administrators)
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: action__startswith
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: target_id
        schema:
          type: string
      - in: query
        name: target_type
        schema:
          type: string
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/v1/admin/billing/accounts/{id}:
    get:
      operationId: admin_billing_accounts_retrieve
      summary: Entitlement state of a billing account (administrators)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSummary'
          description: ''
  /api/v1/admin/billing/credits:
    post:
      operationId: admin_billing_credits_create
      summary: Grant or revoke extra credits for an entitlement key
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditGrantRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreditGrantRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditBalance'
          description: ''
  /api/v1/admin/billing/subscriptions:
    get:
      operationId: admin_billing_subscriptions_list
      summary: Subscriptions (administrators)
      parameters:
      - in: query
        name: billing_account__subject_type
        schema:
          type: string
          enum:
          - account
          - organization
        description: |-
          * `organization` - Organisation
          * `account` - Account
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: plan__code
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - CANCELLED
          - EXPIRED
          - PENDING
          - REJECTED
          - SUSPENDED
        description: |-
          * `PENDING` - Pending administrator approval
          * `ACTIVE` - Active
          * `SUSPENDED` - Suspended
          * `CANCELLED` - Cancelled
          * `EXPIRED` - Expired
          * `REJECTED` - Rejected
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminSubscriptionList'
          description: ''
  /api/v1/admin/billing/subscriptions/{id}/activate:
    post:
      operationId: admin_billing_subscriptions_activate_create
      summary: Activate a subscription after verifying payment manually
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSubscription'
          description: ''
  /api/v1/admin/billing/subscriptions/{id}/cancel:
    post:
      operationId: admin_billing_subscriptions_cancel_create
      summary: Cancel a subscription
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSubscription'
          description: ''
  /api/v1/admin/billing/subscriptions/{id}/reject:
    post:
      operationId: admin_billing_subscriptions_reject_create
      summary: Reject a pending subscription request
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSubscription'
          description: ''
  /api/v1/admin/billing/subscriptions/{id}/suspend:
    post:
      operationId: admin_billing_subscriptions_suspend_create
      summary: Suspend an active subscription
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSubscription'
          description: ''
  /api/v1/admin/marketplace/companies:
    get:
      operationId: admin_marketplace_companies_list
      summary: Medical companies (administrators)
      parameters:
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: verification_status
        schema:
          type: string
          enum:
          - PENDING
          - REJECTED
          - SUSPENDED
          - UNVERIFIED
          - VERIFIED
        description: |-
          * `UNVERIFIED` - Unverified
          * `PENDING` - Pending review
          * `VERIFIED` - Verified
          * `REJECTED` - Rejected
          * `SUSPENDED` - Suspended
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCompanyAdminList'
          description: ''
  /api/v1/admin/marketplace/companies/{id}/verification:
    post:
      operationId: admin_marketplace_companies_verification_create
      summary: Decide a company's verification
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyVerificationDecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompanyVerificationDecisionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyAdmin'
          description: ''
  /api/v1/admin/providers/{id}/verification:
    post:
      operationId: admin_providers_verification_create
      summary: Set a provider's verification status (administrators)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationDecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerificationDecisionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderOwner'
          description: ''
  /api/v1/admin/recruitment/employers:
    get:
      operationId: admin_recruitment_employers_list
      summary: Employers (administrators)
      parameters:
      - in: query
        name: organization_type
        schema:
          type: string
          enum:
          - BEAUTY_CENTER
          - CLINIC
          - HEALTHCARE_INSTITUTION
          - HOSPITAL
          - LABORATORY
          - MEDICAL_CENTER
          - MEDICAL_COMPANY
          - OTHER
          - PHARMACY
          - RECRUITMENT_AGENCY
          - UNIVERSITY
        description: |-
          * `HOSPITAL` - Hospital
          * `MEDICAL_CENTER` - Medical center
          * `CLINIC` - Clinic
          * `PHARMACY` - Pharmacy
          * `LABORATORY` - Laboratory
          * `BEAUTY_CENTER` - Beauty center
          * `MEDICAL_COMPANY` - Medical company
          * `HEALTHCARE_INSTITUTION` - Healthcare institution
          * `UNIVERSITY` - University / college
          * `RECRUITMENT_AGENCY` - Recruitment agency
          * `OTHER` - Other approved healthcare organisation
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: recruitment_status
        schema:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
        description: |-
          * `ACTIVE` - Active
          * `SUSPENDED` - Suspended
      - name: search
        required: false
        in: query
        description: مصطلح البحث.
        schema:
          type: string
      - in: query
        name: verification_status
        schema:
          type: string
          enum:
          - PENDING
          - REJECTED
          - SUSPENDED
          - UNVERIFIED
          - VERIFIED
        description: |-
          * `UNVERIFIED` - Unverified
          * `PENDING` - Pending review
          * `VERIFIED` - Verified
          * `REJECTED` - Rejected
          * `SUSPENDED` - Suspended
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEmployerAdminList'
          description: ''
  /api/v1/admin/recruitment/employers/{id}/recruitment/{status_value}:
    post:
      operationId: admin_recruitment_employers_recruitment_create
      summary: Suspend or reactivate an employer's recruitment
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: status
        schema:
          type: string
        description: ACTIVE or SUSPENDED
      - in: path
        name: status_value
        schema:
          type: string
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecruitmentReasonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecruitmentReasonRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployerAdmin'
          description: ''
  /api/v1/admin/recruitment/employers/{id}/verification:
    post:
      operationId: admin_recruitment_employers_verification_create
      summary: Set an employer's verification status
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployerVerificationDecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmployerVerificationDecisionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployerAdmin'
          description: ''
  /api/v1/admin/recruitment/jobs:
    get:
      operationId: admin_recruitment_jobs_list
      summary: Jobs for review (administrators)
      parameters:
      - in: query
        name: employer
        schema:
          type: string
          format: uuid
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ARCHIVED
          - CLOSED
          - DRAFT
          - EXPIRED
          - PENDING_ADMIN_REVIEW
          - PUBLISHED
          - REJECTED
          - SUSPENDED
        description: |-
          * `DRAFT` - Draft
          * `PENDING_ADMIN_REVIEW` - Pending administrator review
          * `PUBLISHED` - Published
          * `CLOSED` - Closed
          * `EXPIRED` - Expired
          * `REJECTED` - Rejected
          * `SUSPENDED` - Suspended
          * `ARCHIVED` - Archived
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJobAdminList'
          description: ''
  /api/v1/admin/recruitment/jobs/{id}:
    get:
      operationId: admin_recruitment_jobs_retrieve
      summary: Job details for review
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAdmin'
          description: ''
  /api/v1/admin/recruitment/jobs/{id}/approve:
    post:
      operationId: admin_recruitment_jobs_approve_create
      summary: Approve a pending job (publishes it)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminDecisionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAdmin'
          description: ''
  /api/v1/admin/recruitment/jobs/{id}/reject:
    post:
      operationId: admin_recruitment_jobs_reject_create
      summary: Reject a pending job with a reason
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecruitmentReasonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecruitmentReasonRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAdmin'
          description: ''
  /api/v1/admin/recruitment/jobs/{id}/restore:
    post:
      operationId: admin_recruitment_jobs_restore_create
      summary: Restore a suspended job
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminDecisionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAdmin'
          description: ''
  /api/v1/admin/recruitment/jobs/{id}/suspend:
    post:
      operationId: admin_recruitment_jobs_suspend_create
      summary: Suspend a published job with a reason
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecruitmentReasonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecruitmentReasonRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAdmin'
          description: ''
  /api/v1/advertising/company/campaigns:
    get:
      operationId: advertising_company_campaigns_retrieve
      summary: My campaigns (paginated, newest first)
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: Page number (20 per page).
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - CANCELLED
          - DRAFT
          - PENDING_PAYMENT
          - REJECTED
        description: Filter by status.
      tags:
      - advertising-company
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCampaignOwner'
          description: ''
    post:
      operationId: advertising_company_campaigns_create
      summary: Create a campaign (always a DRAFT)
      tags:
      - advertising-company
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CampaignWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignOwner'
          description: ''
  /api/v1/advertising/company/campaigns/{id}:
    get:
      operationId: advertising_company_campaigns_retrieve_2
      summary: One of my campaigns
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - advertising-company
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignOwner'
          description: ''
    patch:
      operationId: advertising_company_campaigns_partial_update
      summary: Edit a DRAFT campaign (anything else is frozen)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - advertising-company
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCampaignWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCampaignWriteRequest'
